<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Plumelle Atellié</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Jost"', 'sans-serif'],
                    },
                    colors: {
                        tiffany: '#0ABAB5',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black text-zinc-100 font-sans min-h-screen flex flex-col selection:bg-tiffany selection:text-black">

    <!-- Header -->
    <header class="w-full border-b border-zinc-800 py-6 px-6 md:px-12 text-center">
        <a href="#" class="font-serif text-2xl md:text-3xl tracking-widest text-zinc-100 uppercase hover:text-tiffany transition-colors">
            Plumelle
        </a>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-6 py-16">
        <div class="max-w-xl w-full">
            
            <!-- Title Section -->
            <div class="text-center mb-12">
                <h1 class="font-serif text-3xl md:text-4xl font-normal tracking-wide mb-3 text-white">Contact Us</h1>
                <p class="text-zinc-400 text-sm md:text-base font-light tracking-wide">
                    We would love to hear from you. Reach out to us through any of the channels below.
                </p>
            </div>

            <!-- Contact Information Card -->
            <div class="bg-zinc-950 border border-zinc-800 rounded-none p-8 md:p-10 space-y-8 shadow-2xl">
                
                <!-- Phone -->
                <div class="flex items-start space-x-5">
                    <div class="mt-1 text-tiffany">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z"></path>
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-xs uppercase tracking-widest text-zinc-500 font-semibold mb-1">Phone Number</h2>
                        <a href="tel:9007674130" class="text-zinc-200 text-base md:text-lg hover:text-tiffany transition-colors font-light">
                            +91 90076 74130
                        </a>
                    </div>
                </div>

                <!-- Email -->
                <div class="flex items-start space-x-5">
                    <div class="mt-1 text-tiffany">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"></path>
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-xs uppercase tracking-widest text-zinc-500 font-semibold mb-1">Email Address</h2>
                        <a href="mailto:plumelleofficielrequests@gmail.com" class="text-zinc-200 text-base md:text-lg hover:text-tiffany transition-colors font-light break-all">
                            plumelleofficielrequests@gmail.com
                        </a>
                    </div>
                </div>

                <!-- Address -->
                <div class="flex items-start space-x-5">
                    <div class="mt-1 text-tiffany">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"></path>
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-xs uppercase tracking-widest text-zinc-500 font-semibold mb-1">Registered Office Address</h2>
                        <p class="text-zinc-200 text-base md:text-lg font-light leading-relaxed">
                            20/L, Nandan Kanan,<br>
                            Hindmotor, Hooghly,<br>
                            West Bengal – 712233, India
                        </p>
                    </div>
                </div>

            </div>

        </div>
    </main>

   

</body>
</html>
